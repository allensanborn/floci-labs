# Optional. Skip this if Floci is already running (`floci start`, or your own container),
# but give that Floci the same two settings.
#
#   docker.sock — Floci backs the EKS cluster with a real k3s container and ECR with a
#                 real registry:2 container, both started through the socket.
#
#   FLOCI_SERVICES_EKS_DEFAULT_STORAGE_CLASS=true
#               — k3s keeps its local-path provisioner, so lean-cloud's per-node
#                 PersistentVolumeClaims bind. Real EKS ships no default StorageClass,
#                 which is why Floci removes it by default.
#
# The image is a nightly, not :latest, because the in-cluster act pushes to Floci's ECR, and
# floci:latest (2.4.0) answers that push with 503. The only ECR change between 2.4.0 and
# this nightly is floci-io/floci#7224. Go back to :latest once a release includes it.
#
# FLOCI_PORT moves the published port when 4566 is taken; set AWS_ENDPOINT_URL to match.
services:
  floci:
    image: ${FLOCI_IMAGE:-floci/floci:nightly-11012026}
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    environment:
      FLOCI_SERVICES_EKS_DEFAULT_STORAGE_CLASS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
